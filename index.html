<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday, Ancient Husband 💗</title>

<style>

/* =========================================
   BASIC SETUP
========================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffd1e4,
            #fff0f7,
            #ffc0dc,
            #ffe4ef
        );

    color: #5c2441;

    text-align: center;

    overflow: hidden;

}


/* =========================================
   MAIN
========================================= */

.container {

    width: 100%;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}


.card {

    width: 100%;

    max-width: 720px;

    min-height: 500px;

    background:
        rgba(255,255,255,0.94);

    border:
        3px solid #ff9fc5;

    border-radius:
        32px;

    padding:
        40px 25px;

    box-shadow:
        0 20px 60px
        rgba(170,60,110,0.22);

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

}


/* =========================================
   PAGES
========================================= */

.page {

    width: 100%;

    animation:
        pageEnter 0.7s ease forwards;

}


.page.exit {

    animation:
        pageExit 0.45s ease forwards;

}


@keyframes pageEnter {

    from {

        opacity: 0;

        transform:
            translateX(70px)
            scale(0.95);

    }

    to {

        opacity: 1;

        transform:
            translateX(0)
            scale(1);

    }

}


@keyframes pageExit {

    from {

        opacity: 1;

        transform:
            translateX(0)
            scale(1);

    }

    to {

        opacity: 0;

        transform:
            translateX(-70px)
            scale(0.95);

    }

}


/* =========================================
   TEXT ANIMATIONS
========================================= */

.animate-text {

    animation:
        textPop 0.9s ease forwards;

}


@keyframes textPop {

    0% {

        opacity: 0;

        transform:
            translateY(25px);

    }

    100% {

        opacity: 1;

        transform:
            translateY(0);

    }

}


.bigTitle {

    font-size:
        clamp(38px, 9vw, 70px);

    color:
        #e94f91;

    margin:
        15px 0;

    animation:
        titleBounce 1s ease;

}


@keyframes titleBounce {

    0% {

        opacity: 0;

        transform:
            scale(0.5);

    }

    70% {

        transform:
            scale(1.1);

    }

    100% {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* =========================================
   HEART
========================================= */

.heart {

    font-size:
        65px;

    animation:
        heartbeat 1s infinite alternate;

}


@keyframes heartbeat {

    from {

        transform:
            scale(1);

    }

    to {

        transform:
            scale(1.18);

    }

}


/* =========================================
   HEADINGS
========================================= */

h2 {

    color:
        #df4d89;

    font-size:
        30px;

}


p {

    font-size:
        18px;

    line-height:
        1.7;

}


/* =========================================
   BUTTONS
========================================= */

button {

    border:
        none;

    border-radius:
        50px;

    padding:
        15px 27px;

    margin:
        10px 5px;

    font-size:
        16px;

    font-weight:
        bold;

    cursor:
        pointer;

    background:
        #ed5795;

    color:
        white;

    box-shadow:
        0 7px 18px
        rgba(220,70,130,0.25);

    transition:
        transform 0.2s ease;

}


button:hover {

    transform:
        scale(1.08);

}


.secondary {

    background:
        #ffd0e2;

    color:
        #8c315b;

}


.next {

    margin-top:
        25px;

    background:
        linear-gradient(
            135deg,
            #ec5594,
            #d9367c
        );

    padding:
        16px 32px;

}


.next::after {

    content:
        " →";

}


/* =========================================
   OLD MAN WARNING
========================================= */

.old {

    color:
        #c63f78;

    font-weight:
        bold;

    font-size:
        22px;

    animation:
        warning 1s infinite alternate;

}


@keyframes warning {

    from {

        opacity:
            0.65;

    }

    to {

        opacity:
            1;

    }

}


/* =========================================
   CAKE
========================================= */

.cake {

    font-size:
        110px;

    animation:
        cakeBounce 1.5s infinite alternate;

}


@keyframes cakeBounce {

    from {

        transform:
            translateY(0);

    }

    to {

        transform:
            translateY(-12px);

    }

}


.flame {

    font-size:
        50px;

    display:
        inline-block;

    animation:
        flameDance
        0.35s
        infinite
        alternate;

}


@keyframes flameDance {

    from {

        transform:
            rotate(-7deg)
            scale(1);

    }

    to {

        transform:
            rotate(7deg)
            scale(1.15);

    }

}


.flame.out {

    animation:
        none;

    opacity:
        0.3;

}


/* =========================================
   RATINGS
========================================= */

.rating {

    font-size:
        21px;

    margin:
        12px;

}


/* =========================================
   BIG EMOJIS
========================================= */

.big {

    font-size:
        55px;

}


/* =========================================
   RUNNING BUTTON
========================================= */

.running {

    position:
        relative;

}


/* =========================================
   FLOATING HEARTS
========================================= */

.floating-heart {

    position:
        fixed;

    bottom:
        -60px;

    font-size:
        28px;

    z-index:
        999;

    pointer-events:
        none;

    animation:
        floatHeart
        6s
        linear
        forwards;

}


@keyframes floatHeart {

    from {

        transform:
            translateY(0)
            rotate(0deg);

        opacity:
            1;

    }

    to {

        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity:
            0;

    }

}


/* =========================================
   BALLOONS
========================================= */

.balloon {

    position:
        fixed;

    bottom:
        -100px;

    font-size:
        60px;

    z-index:
        998;

    pointer-events:
        none;

    animation:
        balloonFloat
        8s
        linear
        forwards;

}


@keyframes balloonFloat {

    from {

        transform:
            translateY(0)
            rotate(-8deg);

    }

    50% {

        transform:
            translateY(-50vh)
            rotate(8deg);

    }

    to {

        transform:
            translateY(-115vh)
            rotate(-8deg);

    }

}


/* =========================================
   CONFETTI
========================================= */

.confetti {

    position:
        fixed;

    top:
        -50px;

    z-index:
        9999;

    pointer-events:
        none;

    animation:
        confettiFall
        4s
        linear
        forwards;

}


@keyframes confettiFall {

    0% {

        transform:
            translateY(0)
            rotate(0deg)
            scale(1);

        opacity:
            1;

    }

    100% {

        transform:
            translateY(115vh)
            rotate(1000deg)
            scale(0.7);

        opacity:
            0;

    }

}


/* =========================================
   FINAL MESSAGE
========================================= */

.final {

    font-size:
        21px;

    font-weight:
        bold;

    color:
        #d94383;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 500px) {

    .card {

        min-height:
            560px;

        padding:
            30px 16px;

    }

    h2 {

        font-size:
            25px;

    }

    p {

        font-size:
            16px;

    }

    button {

        width:
            90%;

    }

}

</style>

</head>


<body>


<div class="container">

<div class="card">

<div id="app"></div>

</div>

</div>


<script>


/* =================================================
   PAGE SYSTEM
================================================= */

const app =
document.getElementById("app");


let currentPage =
0;


/* =================================================
   ALL THE PAGES
================================================= */

const pages = [

/* PAGE 0 */

`
<div class="page">

<div class="heart">💗</div>

<h1 class="bigTitle">
HAPPY BIRTHDAY
</h1>

<h2>
MY VERY OLD HUSBAND
</h2>

<p class="old">
🚨 WARNING 🚨
</p>

<p>
You are about to enter the official
birthday website of a man who is
getting VERY VERY VERY old.
</p>

<button class="next" onclick="nextPage()">
ENTER AT YOUR OWN RISK
</button>

</div>
`,


/* PAGE 1 */

`
<div class="page">

<div class="big">
👴
</div>

<h2>
FIRST OF ALL...
</h2>

<p>
Congratulations!
</p>

<p>
You have successfully survived
another year on this planet.
</p>

<button class="next" onclick="nextPage()">
CONTINUE
</button>

</div>
`,


/* PAGE 2 */

`
<div class="page">

<div class="big">
🦖
</div>

<h2>
WE NEED TO TALK ABOUT YOUR AGE.
</h2>

<p>
At this point,
calling you "old" would actually
be an understatement.
</p>

<p class="old">
YOU ARE VERY VERY VERY OLD.
</p>

<button class="next" onclick="nextPage()">
I ACCEPT MY FATE
</button>

</div>
`,


/* PAGE 3 */

`
<div class="page">

<div class="big">
🪨
</div>

<h2>
YOUR AGE IS NOW HISTORICAL.
</h2>

<p>
You are older than rocks.
</p>

<p>
Older than dinosaurs.
</p>

<p>
Older than most civilizations.
</p>

<p>
Basically an archaeological artifact.
</p>

<button class="next" onclick="nextPage()">
THAT'S ENOUGH 😭
</button>

</div>
`,


/* PAGE 4 */

`
<div class="page">

<div class="big">
📋
</div>

<h2>
OFFICIAL HUSBAND PERFORMANCE REVIEW
</h2>

<div class="rating">
❤️ Being handsome: 11/10
</div>

<div class="rating">
😂 Making me laugh: 10/10
</div>

<div class="rating">
🙄 Annoying me: 100/10
</div>

<div class="rating">
📱 Replying on time: UNDER INVESTIGATION
</div>

<div class="rating">
👴 Acting ancient: 999/10
</div>

<div class="rating">
💍 Being my husband: ∞/10
</div>

<button class="next" onclick="nextPage()">
NEXT
</button>

</div>
`,


/* PAGE 5 */

`
<div class="page">

<h2>
🎂 THE ANNUAL CAKE CEREMONY 🎂
</h2>

<div class="cake">
🎂
</div>

<p>
One candle represents another year
of your ancient existence.
</p>

<div
id="flame"
class="flame"
>
🔥
</div>

<br>

<button
id="blowButton"
onclick="blowCandle()"
>
💨 BLOW OUT THE CANDLE
</button>

<p id="candleMessage">
Go on, old man.
You still have enough lung power.
😭
</p>

</div>
`,


/* PAGE 6 */

`
<div class="page">

<div class="big">
💨
</div>

<h2>
YOU DID IT!
</h2>

<p>
The candle is officially dead.
</p>

<p>
And somehow...
</p>

<p class="old">
SO ARE A FEW OF YOUR REMAINING YOUTHFUL YEARS.
😭
</p>

<button class="next" onclick="nextPage()">
CONTINUE
</button>

</div>
`,


/* PAGE 7 */

`
<div class="page">

<div class="big">
💍
</div>

<h2>
HUSBAND TEST
</h2>

<p>
Do you promise to continue
loving your wife forever?
</p>

<button onclick="loveYes()">
YES ❤️
</button>

<button
id="husbandNo"
class="secondary running"
onmouseenter="runAway(this)"
>
NO 🙄
</button>

<p id="loveResult"></p>

</div>
`,


/* PAGE 8 */

`
<div class="page">

<div class="big">
🏆
</div>

<h2>
OFFICIAL AWARD
</h2>

<p>
After extensive scientific research,
careful investigation,
and absolutely no outside opinions...
</p>

<h2>
YOU HAVE WON:
</h2>

<h1>
🏆 BEST HUSBAND 🏆
</h1>

<p>
Prize:
</p>

<p>
ONE EXTREMELY CUTE WIFE.
</p>

<p>
Unfortunately,
she is completely non-refundable.
😭
</p>

<button class="next" onclick="nextPage()">
ACCEPT YOUR AWARD
</button>

</div>
`,


/* PAGE 9 */

`
<div class="page">

<div class="big">
🧓
</div>

<h2>
THE ANCIENT HUSBAND QUIZ
</h2>

<p>
What do you need most
at your advanced age?
</p>

<button onclick="quiz('coffee')">
☕ COFFEE
</button>

<button onclick="quiz('nap')">
🛌 A NAP
</button>

<button onclick="quiz('back')">
💊 BACK PAIN MEDICINE
</button>

<p id="quizResult"></p>

</div>
`,


/* PAGE 10 */

`
<div class="page">

<div class="heart">
💗
</div>

<h2>
OKAY...
ENOUGH BULLYING.
</h2>

<p>
Because despite being
VERY VERY VERY old...
</p>

<p>
you are still my favorite person.
</p>

<p>
My favorite human.
</p>

<p>
My favorite idiot.
</p>

<button class="next" onclick="nextPage()">
ONE LAST THING...
</button>

</div>
`,


/* PAGE 11 */

`
<div class="page">

<div class="big">
💌
</div>

<h2>
ONE SERIOUS MOMENT
</h2>

<p class="final">
Happy Birthday, my love. ❤️
</p>

<p class="final">
I hope this year brings you
everything you've been wishing for.
</p>

<p class="final">
Thank you for being my person,
my partner,
and my favorite person
to annoy.
</p>

<p class="final">
I love you more than you probably realize.
</p>

<p class="final">
Even though you're ancient.
😭❤️
</p>

<button class="next" onclick="nextPage()">
I'M NOT DONE YET...
</button>

</div>
`,


/* PAGE 12 */

`
<div class="page">

<div class="big">
🎉
</div>

<h2>
THE FINAL SURPRISE
</h2>

<p>
Are you ready?
</p>

<button
class="pulse"
onclick="finalExplosion()"
>
🎉 RELEASE THE CHAOS 🎉
</button>

<p id="finalMessage"></p>

</div>
`

];


/* =================================================
   SHOW FIRST PAGE
================================================= */

showPage(0);


/* =================================================
   SHOW PAGE
================================================= */

function showPage(index) {

    app.innerHTML =
        pages[index];

}


/* =================================================
   NEXT PAGE
================================================= */

function nextPage() {

    const oldPage =
        document.querySelector(".page");


    if (oldPage) {

        oldPage.classList.add("exit");

    }


    setTimeout(function() {

        currentPage++;


        if (
            currentPage
            >= pages.length
        ) {

            currentPage =
                pages.length - 1;

        }


        showPage(
            currentPage
        );


        createSmallCelebration();


    }, 400);

}


/* =================================================
   CANDLE
================================================= */

function blowCandle() {

    const flame =
        document.getElementById("flame");

    const message =
        document.getElementById("candleMessage");


    if (!flame) return;


    flame.innerHTML =
        "💨";

    flame.classList.add(
        "out"
    );


    message.innerHTML =
        "💨 CANDLE BLOWN OUT! 💨" +
        "<br><br>" +
        "Well done, ancient one." +
        "<br>" +
        "You still have some breath left. 😭";


    createConfetti(150);


    setTimeout(
        function() {

            nextPage();

        },
        2500
    );

}


/* =================================================
   HUSBAND YES
================================================= */

function loveYes() {

    const result =
        document.getElementById(
            "loveResult"
        );


    result.innerHTML =
        "CORRECT ANSWER. 😌❤️" +
        "<br><br>" +
        "Your husband privileges have been renewed." +
        "<br><br>" +
        "You may continue to the next stage.";


    createHearts();


    setTimeout(
        function() {

            nextPage();

        },
        2200
    );

}


/* =================================================
   RUNNING BUTTON
================================================= */

function runAway(button) {

    const x =
        Math.random()
        * 260
        - 130;

    const y =
        Math.random()
        * 180
        - 90;


    button.style.transform =
        `translate(${x}px, ${y}px)`;

}


/* =================================================
   QUIZ
================================================= */

function quiz(answer) {

    const result =
        document.getElementById(
            "quizResult"
        );


    if (answer === "coffee") {

        result.innerHTML =
            "☕ CORRECT." +
            "<br>" +
            "Ancient husbands require coffee.";

    }


    if (answer === "nap") {

        result.innerHTML =
            "🛌 ALSO CORRECT." +
            "<br>" +
            "At your age, naps are basically mandatory.";

    }


    if (answer === "back") {

        result.innerHTML =
            "💊 EXTREMELY CORRECT." +
            "<br>" +
            "Please consult your nearest archaeologist.";

    }


    setTimeout(
        function() {

            nextPage();

        },
        2200
    );

}


/* =================================================
   SMALL CELEBRATION BETWEEN PAGES
================================================= */

function createSmallCelebration() {

    createHearts();

}


/* =================================================
   HEARTS
================================================= */

function createHearts() {

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const heart =
            document.createElement(
                "div"
            );


        heart.className =
            "floating-heart";


        heart.innerText =
            [
                "💗",
                "💕",
                "💖",
                "❤️"
            ][
                Math.floor(
                    Math.random() * 4
                )
            ];


        heart.style.left =
            Math.random()
            * 100
            + "vw";


        heart.style.animationDelay =
            Math.random()
            * 1.5
            + "s";


        document.body
            .appendChild(heart);


        setTimeout(
            function() {

                heart.remove();

            },
            7000
        );

    }

}


/* =================================================
   BALLOONS
================================================= */

function createBalloons() {

    for (
        let i = 0;
        i < 15;
        i++
    ) {

        const balloon =
            document.createElement(
                "div"
            );


        balloon.className =
            "balloon";


        balloon.innerText =
            [
                "🎈",
                "🎈",
                "🎈",
                "💗"
            ][
                Math.floor(
                    Math.random() * 4
                )
            ];


        balloon.style.left =
            Math.random()
            * 100
            + "vw";


        balloon.style.animationDelay =
            Math.random()
            * 4
            + "s";


        document.body
            .appendChild(balloon);


        setTimeout(
            function() {

                balloon.remove();

            },
            12000
        );

    }

}


/* =================================================
   MASSIVE FINAL CONFETTI
================================================= */

function createConfetti(amount = 100) {

    const emojis = [

        "🎉",
        "💗",
        "💕",
        "✨",
        "🎂",
        "💖",
        "🥳",
        "🎈",
        "❤️",
        "🌸",
        "⭐",
        "💐"

    ];


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.innerText =
            emojis[
                Math.floor(
                    Math.random()
                    * emojis.length
                )
            ];


        piece.style.left =
            Math.random()
            * 100
            + "vw";


        piece.style.animationDelay =
            Math.random()
            * 2
            + "s";


        piece.style.fontSize =
            (
                18
                +
                Math.random()
                * 32
            )
            + "px";


        piece.style.animationDuration =
            (
                3
                +
                Math.random()
                * 3
            )
            + "s";


        document.body
            .appendChild(piece);


        setTimeout(
            function() {

                piece.remove();

            },
            7000
        );

    }

}


/* =================================================
   FINAL EXPLOSION
================================================= */

function finalExplosion() {

    const message =
        document.getElementById(
            "finalMessage"
        );


    message.innerHTML =
        "🎉🎉🎉🎉🎉" +
        "<br><br>" +
        "HAPPY BIRTHDAY, MY ANCIENT HUSBAND! ❤️" +
        "<br><br>" +
        "I LOVE YOU SO MUCH. 💗" +
        "<br><br>" +
        "NOW GO ENJOY BEING OLD. 👴";


    /*
       MASSIVE CONFETTI
    */

    createConfetti(500);


    /*
       LOTS OF HEARTS
    */

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        setTimeout(
            function() {

                createHearts();

            },
            i * 400
        );

    }


    /*
       LOTS OF BALLOONS
    */

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        setTimeout(
            function() {

                createBalloons();

            },
            i * 500
        );

    }


    /*
       MORE CONFETTI WAVES
    */

    setTimeout(
        function() {

            createConfetti(300);

        },
        1500
    );


    setTimeout(
        function() {

            createConfetti(300);

        },
        3000
    );


    setTimeout(
        function() {

            createConfetti(300);

        },
        5000
    );

}


</script>

</body>

</html>
