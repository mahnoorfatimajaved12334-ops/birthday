<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Husband ❤️</title>

<style>
* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff0f6, #ffc2dc);
    color: #5c2441;
    text-align: center;
    overflow: hidden;
}

.container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 750px;
    min-height: 520px;
    background: rgba(255,255,255,0.94);
    border: 3px solid #ff9fc5;
    border-radius: 30px;
    padding: 40px 25px;
    box-shadow: 0 15px 40px rgba(170,60,110,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.screen {
    width: 100%;
    animation: screenIn 0.75s cubic-bezier(.2,.8,.2,1) forwards;
}

.screen.exit {
    animation: screenOut 0.45s ease forwards;
}

@keyframes screenIn {
    0% {
        opacity: 0;
        transform: translateX(70px) scale(.94);
        filter: blur(4px);
    }
    70% { transform: translateX(-6px) scale(1.01); }
    100% {
        opacity: 1;
        transform: translateX(0) scale(1);
        filter: blur(0);
    }
}

@keyframes screenOut {
    0% {
        opacity: 1;
        transform: translateX(0) scale(1);
    }
    100% {
        opacity: 0;
        transform: translateX(-70px) scale(.94);
    }
}

.textIn {
    animation: textIn .8s .12s both ease-out;
}

@keyframes textIn {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.heart {
    font-size: 60px;
    animation: heartbeat 1.1s infinite alternate;
}

@keyframes heartbeat {
    from { transform: scale(1); }
    to { transform: scale(1.18); }
}

h1 {
    font-size: clamp(38px, 9vw, 70px);
    color: #e94f91;
    margin: 15px 0;
}

h2 { color: #df4d89; }

p {
    font-size: 18px;
    line-height: 1.6;
}

.old-warning {
    font-size: 24px;
    font-weight: bold;
    color: #b83c72;
    animation: warningPulse 1s infinite alternate;
}

@keyframes warningPulse {
    from { opacity: .65; }
    to { opacity: 1; }
}

.big { font-size: 45px; }

.rating {
    font-size: 21px;
    margin: 13px;
}

.final-message {
    font-size: 21px;
    font-weight: bold;
    color: #d94383;
}

button {
    border: none;
    border-radius: 50px;
    padding: 15px 25px;
    margin: 10px 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    background: #ed5795;
    color: white;
    box-shadow: 0 7px 18px rgba(220,70,130,.25);
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 10px 24px rgba(220,70,130,.35);
}

.secondary {
    background: #ffd0e2;
    color: #8c315b;
}

.next {
    margin-top: 25px;
    background: linear-gradient(135deg, #ec5594, #d9367c);
    padding: 16px 32px;
}

.next::after { content: " →"; }

.pulse {
    animation: pulse 1s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
}

.cake {
    font-size: 100px;
    margin: 15px;
    animation: cakeBounce 2s infinite;
}

@keyframes cakeBounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.flame {
    display: inline-block;
    font-size: 45px;
    animation: flameDance .4s infinite alternate;
}

@keyframes flameDance {
    from { transform: scale(1) rotate(-5deg); }
    to { transform: scale(1.15) rotate(5deg); }
}

.flame.out {
    animation: none;
    opacity: .25;
}

.confetti {
    position: fixed;
    top: -40px;
    z-index: 9999;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(115vh) rotate(1100deg);
        opacity: 0;
    }
}

.floating-heart {
    position: fixed;
    bottom: -50px;
    z-index: 1;
    pointer-events: none;
    animation: floatUp 6s linear forwards;
}

@keyframes floatUp {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: .9;
    }
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

.balloon {
    position: fixed;
    bottom: -100px;
    z-index: 1;
    font-size: 55px;
    pointer-events: none;
    animation: balloonUp 8s linear forwards;
}

@keyframes balloonUp {
    from { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-50vh) rotate(8deg); }
    to { transform: translateY(-115vh) rotate(-8deg); }
}

#app {
    width: 100%;
}

@media (max-width: 500px) {
    .card {
        min-height: 560px;
        padding: 30px 16px;
    }

    p { font-size: 16px; }

    h2 { font-size: 25px; }

    button { width: 90%; }
}
</style>
</head>

<body>
<div class="container">
<div class="card">
<div id="app"></div>
</div>
</div>

<script>

    <button class="next" onclick="nextScreen()">NEXT</button>
</div>

<div class="screen">

`,

/* 34 */

</div>
`,

/* 35 */
`
<div class="screen">

    <button id="confettiButton" class="pulse" onclick="finalExplosion()">

];

function showScreen(index) {
    app.innerHTML = screens[index];
}

function nextScreen() {
    const oldScreen = document.querySelector(".screen");

    if (oldScreen) oldScreen.classList.add("exit");

    setTimeout(() => {
        currentScreen++;

        if (currentScreen >= screens.length) {
            currentScreen = screens.length - 1;
        }

        showScreen(currentScreen);
        createHearts(4);
    }, 420);
}

/* First page / opening */
function startBirthday() {
    nextScreen();
}

/* Candle */
function blowCandle() {
    if (candleBlown) return;

    candleBlown = true;

    const flame = document.getElementById("flame");
    const message = document.getElementById("candleMessage");
    const button = document.getElementById("blowButton");

    if (flame) {
        flame.innerHTML = "💨";
        flame.classList.add("out");
    }

    if (message) {
        message.innerHTML =
            "💨 CANDLE BLOWN OUT! 💨<br><br>" +
            "Congratulations, ancient one. " +
            "You survived another year. 😭";
    }

    if (button) {
        button.innerHTML = "🎉 CANDLE DEFEATED!";
        button.disabled = true;
    }

    createConfetti(180);

    setTimeout(() => nextScreen(), 2200);
}

/* Husband test */
function loveYes() {
    const result = document.getElementById("loveResult");

    if (result) {
        result.innerHTML =
            "CORRECT ANSWER. 😌❤️" +
            "<br><br>" +
            "Your husband privileges have been renewed for another year.";
    }

    createHearts(20);

    setTimeout(() => nextScreen(), 2200);
}

function runAway(button) {
    const x = Math.random() * 260 - 130;
    const y = Math.random() * 180 - 90;

    button.style.transform = `translate(${x}px, ${y}px)`;
}

/* Quiz */
function quiz(answer) {
    const result = document.getElementById("quizResult");

    if (!result) return;

    if (answer === "chai") {
        result.innerHTML =
            '☕ CORRECT. You get a reward for a hundred kisses that you may redeem anytime';
    }

    if (answer === "nap") {
        result.innerHTML =
            "🛌 CORRECT. At your age, naps are basically mandatory.";
    }

    if (answer === "back") {
        result.innerHTML =
            "💊 VERY CORRECT. Please consult your nearest archaeologist.";
    }

    setTimeout(() => nextScreen(), 2400);
}

/* Confetti */
function createConfetti(amount = 100) {
    const emojis = [
        "🎉","💗","💕","✨","🎂","💖","🥳",
        "🎈","❤️","🌸","⭐","💐","🎊","🩷"
    ];

    for (let i = 0; i < amount; i++) {
        const piece = document.createElement("div");

        piece.className = "confetti";

        piece.innerText =
            emojis[Math.floor(Math.random() * emojis.length)];

        piece.style.left =
            Math.random() * 100 + "vw";

        piece.style.animationDelay =
            Math.random() * 2.5 + "s";

        piece.style.fontSize =
            (15 + Math.random() * 32) + "px";

        piece.style.animationDuration =
            (3 + Math.random() * 3.5) + "s";

        document.body.appendChild(piece);

        setTimeout(() => piece.remove(), 7500);
    }
}

/* Hearts */
function createHearts(amount = 15) {
    for (let i = 0; i < amount; i++) {
        const heart = document.createElement("div");

        heart.className = "floating-heart";

        heart.innerText =
            ["💗","💕","💖","❤️"][Math.floor(Math.random() * 4)];

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.animationDelay =
            Math.random() * 2 + "s";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 7000);
    }
}

/* Balloons */
function createBalloons(amount = 8) {
    for (let i = 0; i < amount; i++) {
        const balloon = document.createElement("div");

        balloon.className = "balloon";

        balloon.innerText =
            ["🎈","🎈","🎈","💗"][Math.floor(Math.random() * 4)];

        balloon.style.left =
            Math.random() * 100 + "vw";

        balloon.style.animationDelay =
            Math.random() * 3 + "s";

        document.body.appendChild(balloon);

        setTimeout(() => balloon.remove(), 10000);
    }
}

/* MASSIVE FINAL CHAOS */
function finalExplosion() {
    if (finalStarted) return;
    finalStarted = true;

    const message = document.getElementById("confettiMessage");

    if (message) {
        message.innerHTML =
            "🎉🎉🎉 HAPPY BIRTHDAY, ANCIENT HUSBAND! 🎉🎉🎉";
    }

    /* Much bigger than before */
    createConfetti(700);
    createHearts(45);
    createBalloons(25);

    setTimeout(() => createConfetti(500), 1000);
    setTimeout(() => createHearts(35), 1300);
    setTimeout(() => createBalloons(18), 1600);

    setTimeout(() => createConfetti(500), 2500);
    setTimeout(() => createHearts(35), 2800);

    setTimeout(() => createConfetti(500), 4200);
    setTimeout(() => createBalloons(18), 4500);

    setTimeout(() => createConfetti(700), 6000);
}

/* Start with the original opening content visible.
   The opening itself now uses the YES/NO interaction
   without showing all later sections at once. */
showScreen(0);
</script>
</body>
</html>
